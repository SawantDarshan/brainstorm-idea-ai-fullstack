    // ══════════════ COMMAND PALETTE (Ctrl+K) ══════════════
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        openCommandPalette();
      }
      if (e.key === 'Escape') {
        closeCmdPalette();
      }
    });

    function openCommandPalette() {
      closeCmdPalette();
      const backdrop = document.createElement('div');
      backdrop.className = 'cmd-backdrop'; backdrop.id = 'cmd-backdrop';
      backdrop.onclick = closeCmdPalette;
      document.body.appendChild(backdrop);

      const palette = document.createElement('div');
      palette.className = 'cmd-palette'; palette.id = 'cmd-palette';
      palette.innerHTML = `<input class="cmd-palette-input" id="cmd-input" placeholder="Search nodes, actions…" autofocus /><div class="cmd-results" id="cmd-results"></div>`;
      document.body.appendChild(palette);

      const input = document.getElementById('cmd-input');
      input.oninput = () => renderCmdResults(input.value);
      input.onkeydown = (e) => {
        if (e.key === 'Escape') closeCmdPalette();
        if (e.key === 'Enter') {
          const active = document.querySelector('.cmd-result--active') || document.querySelector('.cmd-result');
          if (active) active.click();
        }
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          const items = [...document.querySelectorAll('.cmd-result')];
          const idx = items.findIndex(i => i.classList.contains('cmd-result--active'));
          items.forEach(i => i.classList.remove('cmd-result--active'));
          const next = e.key === 'ArrowDown' ? Math.min(idx + 1, items.length - 1) : Math.max(idx - 1, 0);
          if (items[next]) items[next].classList.add('cmd-result--active');
        }
      };
      renderCmdResults('');
    }

    function closeCmdPalette() {
      const b = document.getElementById('cmd-backdrop'); if (b) b.remove();
      const p = document.getElementById('cmd-palette'); if (p) p.remove();
    }

    function renderCmdResults(query) {
      const results = document.getElementById('cmd-results');
      if (!results) return;
      const q = query.toLowerCase();
      let items = [];

      // Actions
      items.push({ icon: '🔬', label: 'Research a topic', hint: '', action: () => { closeCmdPalette(); showResearchModal(); } });
      items.push({ icon: '✨', label: 'Auto-organize canvas', hint: '', action: () => { closeCmdPalette(); document.getElementById('btn-organize').click(); } });
      items.push({ icon: '📝', label: 'Create Notes', hint: '', action: () => { closeCmdPalette(); showCreateNotesModal(); } });

      // Nodes
      allNodesData.filter(n => n.node_type !== 'system').forEach(n => {
        items.push({
          icon: '⬡', label: n.filename || n.node_id,
          hint: `${(n.characters || 0).toLocaleString()} chars`,
          action: () => {
            closeCmdPalette();
            const el = document.getElementById(`node-${n.node_id}`);
            if (el) {
              // Pan to node
              const nx = parseInt(el.style.left), ny = parseInt(el.style.top);
              const rect = canvas.getBoundingClientRect();
              panX = rect.width / 2 - nx * zoom;
              panY = rect.height / 2 - ny * zoom;
              applyTransform();
              openNodePanel(el);
            }
          }
        });
      });

      // Filter
      if (q) items = items.filter(i => i.label.toLowerCase().includes(q));

      results.innerHTML = '';
      items.slice(0, 12).forEach((item, i) => {
        const div = document.createElement('div');
        div.className = 'cmd-result' + (i === 0 ? ' cmd-result--active' : '');
        div.innerHTML = `<span class="cmd-result-icon">${item.icon}</span><span class="cmd-result-label">${escapeHtml(item.label)}</span><span class="cmd-result-hint">${item.hint}</span>`;
        div.onclick = item.action;
        results.appendChild(div);
      });
    }

    // ══════════════ CHAT SYSTEM NODE ══════════════
    function initChat() {
      const input = document.getElementById('chat-input');
      const btn = document.getElementById('chat-send');
      if (!input || !btn) return;
      btn.onclick = () => sendSysChat(input, btn);
      input.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendSysChat(input, btn); } };
    }
    async function sendSysChat(input, btn) {
      const msg = input.value.trim(); if (!msg) return;
      input.value = ''; btn.disabled = true; btn.textContent = '…';
      try {
        const res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session_id: sessionId, message: msg, source: 'text' }) });
        if (!res.ok) throw new Error('Failed');
        addChildNode(await res.json());
      } catch (err) { console.error(err); }
      btn.disabled = false; btn.textContent = 'Send ⏎';
    }

    // ══════════════ VOICE ══════════════
    function initVoice() {
      const btn = document.getElementById('voice-btn');
      const status = document.getElementById('voice-status');
      if (!btn) return;
      let recognition = null, listening = false;
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SR(); recognition.continuous = false; recognition.interimResults = false;
        recognition.onresult = async (ev) => {
          const t = ev.results[0][0].transcript;
          status.textContent = `"${t.slice(0, 35)}…"`; listening = false; btn.textContent = '🎙'; btn.classList.remove('listening');
          try {
            const res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session_id: sessionId, message: t, source: 'voice' }) });
            if (!res.ok) throw new Error('Failed');
            addChildNode(await res.json()); status.textContent = 'Click to speak';
          } catch { status.textContent = '❌ Failed'; }
        };
        recognition.onerror = () => { listening = false; btn.textContent = '🎙'; btn.classList.remove('listening'); };
        recognition.onend = () => { listening = false; btn.textContent = '🎙'; btn.classList.remove('listening'); };
      }
      btn.onclick = () => {
        if (!recognition) { status.textContent = 'Not supported'; return; }
        if (listening) { recognition.stop(); } else { recognition.start(); listening = true; btn.textContent = '⏹'; btn.classList.add('listening'); status.textContent = 'Listening…'; }
      };
    }

    // ══════════════ UNIFIED AGENT ══════════════
    let agentSelectedNodes = new Set(), agentSelecting = false;
    const agentConvoHistory = []; // [{role:'user'|'ai', text}]

    function initAgent() {
      const selectBtn = document.getElementById('agent-select-btn');
      const input = document.getElementById('agent-input');
      const sendBtn = document.getElementById('agent-send');
      const micBtn = document.getElementById('agent-mic-btn');
      const convoLog = document.getElementById('agent-convo-log');
      const suggestionsDiv = document.getElementById('agent-suggestions');
      if (!selectBtn) return;

      // ── Select Nodes toggle ──
      selectBtn.onclick = () => {
        agentSelecting = !agentSelecting;
        selectBtn.classList.toggle('agent-action-btn--active', agentSelecting);
        selectBtn.textContent = agentSelecting ? `✓ Done (${agentSelectedNodes.size})` : `🎯 Select (${agentSelectedNodes.size})`;
        document.querySelectorAll('.node').forEach(el => el.classList.toggle('node--selectable', agentSelecting));
      };
      document.addEventListener('click', (e) => {
        if (!agentSelecting) return;
        const nodeEl = e.target.closest('.node'); if (!nodeEl || !nodeEl.dataset.nodeId) return;
        const nid = nodeEl.dataset.nodeId; if (nid.startsWith('system-')) return;
        e.stopPropagation();
        if (agentSelectedNodes.has(nid)) { agentSelectedNodes.delete(nid); nodeEl.classList.remove('node--agent-selected'); }
        else { agentSelectedNodes.add(nid); nodeEl.classList.add('node--agent-selected'); }
        selectBtn.textContent = agentSelecting ? `✓ Done (${agentSelectedNodes.size})` : `🎯 Select (${agentSelectedNodes.size})`;
      }, true);

      // ── Voice (mic button) ──
      let recognition = null, listening = false;
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SR(); recognition.continuous = false; recognition.interimResults = false;
        recognition.onresult = (ev) => {
          const t = ev.results[0][0].transcript;
          input.value = t;
          listening = false; micBtn.textContent = '🎙'; micBtn.classList.remove('listening');
          // Auto-send after voice
          agentSend(input, sendBtn, convoLog, suggestionsDiv);
        };
        recognition.onerror = () => { listening = false; micBtn.textContent = '🎙'; micBtn.classList.remove('listening'); };
        recognition.onend = () => { listening = false; micBtn.textContent = '🎙'; micBtn.classList.remove('listening'); };
      }
      micBtn.onclick = () => {
        if (!recognition) return;
        if (listening) { recognition.stop(); } else {
          recognition.start(); listening = true; micBtn.textContent = '⏹'; micBtn.classList.add('listening');
        }
      };

      // ── Send via conversational planner ──
      sendBtn.onclick = () => agentSend(input, sendBtn, convoLog, suggestionsDiv);
      input.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); agentSend(input, sendBtn, convoLog, suggestionsDiv); } };
    }

    async function agentSend(input, btn, convoLog, suggestionsDiv) {
      const q = input.value.trim(); if (!q) return;
      input.value = ''; btn.disabled = true; btn.textContent = '…';
      suggestionsDiv.innerHTML = '';

      // Add user message
      agentConvoHistory.push({ role: 'user', text: q });
      renderAgentConvo(convoLog);

      try {
        const res = await fetch('/api/agent/converse', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: q,
            conversation_history: agentConvoHistory.slice(-10),
            selected_node_ids: [...agentSelectedNodes],
          }),
        });
        if (!res.ok) throw new Error('Agent failed');

        const reader = res.body.getReader(), decoder = new TextDecoder();
        let buffer = '';
        let lastReplyText = '';

        await new Promise((resolve) => {
          (function read() {
            reader.read().then(({ done, value }) => {
              if (done) { resolve(); return; }
              buffer += decoder.decode(value, { stream: true });
              // Process complete NDJSON lines
              const lines = buffer.split('\n');
              buffer = lines.pop(); // keep incomplete line
              for (const line of lines) {
                if (!line.trim()) continue;
                try {
                  const msg = JSON.parse(line);
                  handleAgentMessage(msg, convoLog, suggestionsDiv);
                  if (msg.type === 'reply') lastReplyText = msg.text;
                } catch (e) { console.warn('Parse error:', line); }
              }
              read();
            });
          })();
        });

        // Save last reply to history
        if (lastReplyText) {
          agentConvoHistory.push({ role: 'ai', text: lastReplyText });
        }
      } catch (err) {
        agentConvoHistory.push({ role: 'ai', text: '❌ ' + err.message });
        renderAgentConvo(convoLog);
      }
      btn.disabled = false; btn.textContent = 'Send ⏎';
    }

    function handleAgentMessage(msg, convoLog, suggestionsDiv) {
      if (msg.type === 'thinking') {
        addAgentMsg(convoLog, 'action', msg.text);
      } else if (msg.type === 'action') {
        addAgentMsg(convoLog, 'action', msg.text);
        // Handle reload action
        if (msg.action === 'reload') {
          setTimeout(() => location.reload(), 1000);
        }
      } else if (msg.type === 'reply') {
        const div = addAgentMsg(convoLog, 'ai', msg.text);
        // Add save-as-node button
        if (msg.text.length > 20) {
          const saveBtn = document.createElement('button');
          saveBtn.className = 'save-as-node-btn';
          saveBtn.textContent = '💾';
          saveBtn.title = 'Save as Node';
          saveBtn.onclick = () => saveConvoAsNode(msg.text, saveBtn);
          div.appendChild(saveBtn);
        }
      } else if (msg.type === 'nodes_created') {
        addAgentMsg(convoLog, 'action', `✅ Created ${msg.count} node(s)`);
        // Add nodes to canvas
        if (msg.nodes) {
          const agentEl = document.getElementById('node-system-agent');
          const ax = parseInt(agentEl.style.left) + 340;
          const ay = parseInt(agentEl.style.top);
          msg.nodes.forEach((meta, i) => {
            allNodesData.push(meta);
            const el = createNodeElement(meta.node_id, meta.filename, ax + i * 30, ay + i * 60, false, 'knowledge');
            el.dataset.nodeId = meta.node_id;
            el.querySelector('.node-status').textContent = `${(meta.characters || 0).toLocaleString()} chars`;
            nodesContainer.appendChild(el);
          });
        }
        // For research that creates many nodes, reload
        if (msg.count > 2) {
          setTimeout(() => location.reload(), 1500);
        }
      } else if (msg.type === 'error') {
        addAgentMsg(convoLog, 'action', '❌ ' + msg.text);
      } else if (msg.type === 'suggestions') {
        suggestionsDiv.innerHTML = '';
        (msg.suggestions || []).forEach(s => {
          const chip = document.createElement('button');
          chip.className = 'suggestion-chip';
          chip.textContent = s;
          chip.onclick = () => {
            const input = document.getElementById('agent-input');
            input.value = s;
            const sendBtn = document.getElementById('agent-send');
            agentSend(input, sendBtn, convoLog, suggestionsDiv);
          };
          suggestionsDiv.appendChild(chip);
        });
      }
    }

    function renderAgentConvo(convoLog) {
      convoLog.innerHTML = '';
      agentConvoHistory.forEach((m, i) => {
        const div = document.createElement('div');
        div.className = `agent-msg agent-msg--${m.role}`;
        const span = document.createElement('span');
        span.textContent = m.text;
        div.appendChild(span);
        if (m.role === 'ai' && m.text.length > 10) {
          const saveBtn = document.createElement('button');
          saveBtn.className = 'save-as-node-btn';
          saveBtn.textContent = '💾';
          saveBtn.title = 'Save as Node';
          saveBtn.onclick = () => saveConvoAsNode(m.text, saveBtn);
          div.appendChild(saveBtn);
        }
        convoLog.appendChild(div);
      });
      convoLog.scrollTop = convoLog.scrollHeight;
    }

    function addAgentMsg(convoLog, role, text) {
      const div = document.createElement('div');
      div.className = `agent-msg agent-msg--${role}`;
      const span = document.createElement('span');
      span.textContent = text;
      div.appendChild(span);
      convoLog.appendChild(div);
      convoLog.scrollTop = convoLog.scrollHeight;
      return div;
    }

    async function saveConvoAsNode(text, btn) {
      const agentEl = document.getElementById('node-system-agent');
      const ax = parseInt(agentEl.style.left) + 340;
      const ay = parseInt(agentEl.style.top) + Math.random() * 100;
      try {
        const res = await fetch('/api/chat', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId, message: text.slice(0, 200), source: 'text' }),
        });
        if (!res.ok) throw new Error('Failed');
        const data = await res.json();
        allNodesData.push(data);
        await fetch(`/api/nodes/${data.node_id}/position`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ x: ax, y: ay }),
        });
        // Save the full text as content
        await fetch(`/api/nodes/${data.node_id}`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: data.filename, content: text }),
        });
        const el = createNodeElement(data.node_id, data.filename, ax, ay, false, 'knowledge');
        el.dataset.nodeId = data.node_id;
        el.querySelector('.node-status').textContent = `${text.length.toLocaleString()} chars`;
        nodesContainer.appendChild(el);
        btn.textContent = '✓'; btn.style.color = 'var(--accent)';
        setTimeout(() => { btn.textContent = '💾'; btn.style.color = ''; }, 1500);
      } catch (err) { console.error(err); btn.textContent = '✕'; }
    }

    function addChildNode(data) {
      allNodesData.push(data);
      const totalPages = Math.ceil(getChildren(data.parent_id).length / PAGE_SIZE);
      pageState[data.parent_id] = totalPages - 1;
      renderChildrenForParent(data.parent_id);
    }

    // ══════════════ GROUP VISUALIZATION ══════════════
    const GROUP_COLORS = [
      { bg: 'rgba(240,160,48,0.06)', border: 'rgba(240,160,48,0.35)', label: 'rgba(240,160,48,0.9)' },
      { bg: 'rgba(96,180,255,0.06)', border: 'rgba(96,180,255,0.35)', label: 'rgba(96,180,255,0.9)' },
      { bg: 'rgba(120,220,120,0.06)', border: 'rgba(120,220,120,0.35)', label: 'rgba(120,220,120,0.9)' },
      { bg: 'rgba(220,120,220,0.06)', border: 'rgba(220,120,220,0.35)', label: 'rgba(220,120,220,0.9)' },
      { bg: 'rgba(255,120,100,0.06)', border: 'rgba(255,120,100,0.35)', label: 'rgba(255,120,100,0.9)' },
    ];

    function drawGroups() {
      // Remove old group rects
      document.querySelectorAll('.group-rect').forEach(el => el.remove());

      // Collect groups from data
      const groups = {};
      allNodesData.forEach(n => {
        const gid = n.group_id;
        if (!gid) return;
        if (!groups[gid]) groups[gid] = [];
        groups[gid].push(n.node_id);
      });

      let colorIdx = 0;
      Object.entries(groups).forEach(([gid, nodeIds]) => {
        if (nodeIds.length < 2) return;
        const color = GROUP_COLORS[colorIdx % GROUP_COLORS.length];
        colorIdx++;

        // Find bounding box of all nodes in this group
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        nodeIds.forEach(nid => {
          const el = document.getElementById(`node-${nid}`);
          if (!el) return;
          const x = parseInt(el.style.left) || 0;
          const y = parseInt(el.style.top) || 0;
          const w = el.offsetWidth || 220;
          const h = el.offsetHeight || 56;
          minX = Math.min(minX, x);
          minY = Math.min(minY, y);
          maxX = Math.max(maxX, x + w);
          maxY = Math.max(maxY, y + h);
        });

        if (minX === Infinity) return;

        const pad = 20;
        const rect = document.createElement('div');
        rect.className = 'group-rect';
        rect.style.left = `${minX - pad}px`;
        rect.style.top = `${minY - pad}px`;
        rect.style.width = `${maxX - minX + pad * 2}px`;
        rect.style.height = `${maxY - minY + pad * 2}px`;
        rect.style.background = color.bg;
        rect.style.borderColor = color.border;

        const label = document.createElement('div');
        label.className = 'group-label';
        label.textContent = `📦 Group (${nodeIds.length})`;
        label.style.background = color.bg;
        label.style.color = color.label;
        rect.appendChild(label);

        // Add invisible drag handle around the edges
        const handle = document.createElement('div');
        handle.className = 'group-rect-handle';
        rect.appendChild(handle);

        // Make group rect draggable via handle
        makeGroupDraggable(handle, rect, gid, nodeIds);

        // Click label to ungroup all
        label.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!confirm(`Ungroup all ${nodeIds.length} nodes?`)) return;
          for (const nid of nodeIds) {
            try { await fetch('/api/nodes/ungroup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ node_id: nid }) }); } catch(err) { console.error(err); }
            const nd = allNodesData.find(n => n.node_id === nid);
            if (nd) nd.group_id = null;
          }
          drawConnectors();
        });

        nodesContainer.appendChild(rect);

        // Also tint grouped node borders
        nodeIds.forEach(nid => {
          const el = document.getElementById(`node-${nid}`);
          if (el) el.style.borderColor = color.border;
        });
      });
    }

    function makeGroupDraggable(handle, rect, gid, nodeIds) {
      let isDragging = false, startX, startY;
      const origPositions = {}; // nodeId -> {x, y}

      handle.addEventListener('mousedown', (e) => {
        if (e.target.closest('.group-label')) return;
        if (spaceDown) return;
        isDragging = true; startX = e.clientX; startY = e.clientY;
        nodeIds.forEach(nid => {
          const el = document.getElementById(`node-${nid}`);
          if (el) origPositions[nid] = { x: parseInt(el.style.left), y: parseInt(el.style.top) };
        });
        rect.classList.add('group-rect--dragging');
        e.preventDefault(); e.stopPropagation();
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const dx = (e.clientX - startX) / zoom, dy = (e.clientY - startY) / zoom;
        nodeIds.forEach(nid => {
          const el = document.getElementById(`node-${nid}`);
          const orig = origPositions[nid];
          if (el && orig) {
            el.style.left = `${orig.x + dx}px`;
            el.style.top = `${orig.y + dy}px`;
          }
        });
        drawConnectors();
      });

      document.addEventListener('mouseup', () => {
        if (!isDragging) return;
        isDragging = false;
        rect.classList.remove('group-rect--dragging');
        // Save all moved node positions
        nodeIds.forEach(nid => {
          const el = document.getElementById(`node-${nid}`);
          if (el) {
            fetch(`/api/nodes/${nid}/position`, {
              method: 'PATCH', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ x: parseInt(el.style.left), y: parseInt(el.style.top) }),
            }).catch(() => {});
          }
        });
      });
    }

    // ══════════════ RIGHT-CLICK CONTEXT MENU ══════════════
    document.addEventListener('contextmenu', (e) => {
      const nodeEl = e.target.closest('.node');
      if (!nodeEl || !nodeEl.dataset.nodeId) return;
      e.preventDefault();
      const nid = nodeEl.dataset.nodeId;
      const nodeData = allNodesData.find(n => n.node_id === nid);
      if (!nodeData) return;

      removeNodeCtxMenus();
      const menu = document.createElement('div');
      menu.className = 'node-ctx-menu';
      menu.style.left = `${e.clientX}px`; menu.style.top = `${e.clientY}px`;

      let html = '';
      if (nodeData.group_id) {
        html += `<button data-action="ungroup">📤 Remove from Group</button>`;
      }
      if (nodeData.parent_id && !nodeData.parent_id.startsWith('system-')) {
        html += `<button data-action="disconnect">🔗 Disconnect from Parent</button>`;
      }
      html += `<button data-action="delete">🗑 Delete Node</button>`;
      menu.innerHTML = html;

      menu.onclick = async (ev) => {
        const action = ev.target.dataset.action; if (!action) return;
        removeNodeCtxMenus();
        if (action === 'ungroup') {
          try {
            await fetch('/api/nodes/ungroup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ node_id: nid }) });
            nodeData.group_id = null;
            nodeEl.style.borderColor = '';
            drawConnectors();
          } catch (err) { console.error(err); }
        } else if (action === 'disconnect') {
          try {
            await fetch('/api/nodes/disconnect', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ source_id: nodeData.parent_id, target_id: nid }) });
            nodeData.parent_id = null;
            nodeEl.dataset.parentId = '';
            drawConnectors();
          } catch (err) { console.error(err); }
        } else if (action === 'delete') {
          nodeEl.querySelector('.node-delete').click();
        }
      };
      document.body.appendChild(menu);
      setTimeout(() => document.addEventListener('click', removeNodeCtxMenus, { once: true }), 10);
    });

    function removeNodeCtxMenus() { document.querySelectorAll('.node-ctx-menu').forEach(m => m.remove()); }

    function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
  </script>
